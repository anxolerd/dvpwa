version: '3.3'

services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqli
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - 5432:5432

  redis:
    image: docker.io/valkey/valkey:9-alpine

  sqli:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - postgres
      - redis
    ports:
      - 8080:8080
    command: |
      wait-for postgres:5432 -- python run.py
